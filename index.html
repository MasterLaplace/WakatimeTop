<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Leaderboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #000;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #fff;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    header.dark-mode {
      background-color: #333;
    }

    .slider-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
    }

    .slider {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .slider input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider .slider-round {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider .slider-round:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider-round {
      background-color: #4CAF50;
    }

    input:checked + .slider-round:before {
      transform: translateX(26px);
    }

    main {
      padding: 2rem;
    }

    select {
      padding: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 0.8rem;
      text-align: left;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    body.dark-mode th {
      background-color: #444;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    body.dark-mode tr:nth-child(even) {
      background-color: #1e1e1e;
    }

    tr:nth-child(odd) {
      background-color: #fff;
    }

    body.dark-mode tr:nth-child(odd) {
      background-color: #2a2a2a;
    }

    tr:hover {
      background-color: #ddd;
    }

    body.dark-mode tr:hover {
      background-color: #333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <h1>Language Leaderboard</h1>
  </header>
  <div class="slider-container">
    <label class="slider">
      <input type="checkbox" id="theme-toggle">
      <span class="slider-round"></span>
    </label>
  </div>
  <main>
    <label for="language-search">Choose a language:</label>
    <input id="language-search" type="search" placeholder="Filter languages… (e.g. rust)"
           autocomplete="off" style="margin: 0 0.5rem; padding: 0.3rem;">
    <select id="language-select">
      <option value="" selected>Global Leaderboard</option>
    </select>

    <div style="margin-top: 1rem;">
      <label for="user-search">Search a user:</label>
      <input id="user-search" type="search" placeholder="Username…"
             autocomplete="off" style="margin: 0 0.5rem; padding: 0.3rem;">
      <span id="user-search-count" style="opacity: 0.7;"></span>
    </div>

    <table id="leaderboard-table" style="display: none;">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th id="score-column">Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h2>Distribution of Elo scores</h2>
    <canvas id="eloChart" style="max-width: 800px; margin-top: 2rem;"></canvas>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    const header = document.querySelector('header');
    const tableRows = document.querySelectorAll('tr');

    // Load the saved theme from localStorage
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      header.classList.add('dark-mode');
      themeToggle.checked = true;
      tableRows.forEach(row => row.classList.add('dark-mode'));
    }

    // Toggle between light and dark mode
    themeToggle.addEventListener('change', () => {
      body.classList.toggle('dark-mode');
      header.classList.toggle('dark-mode');
      tableRows.forEach(row => row.classList.toggle('dark-mode'));
      const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', theme);
    });

    const languageSelect = document.getElementById('language-select');
    const leaderboardTable = document.getElementById('leaderboard-table');
    const leaderboardBody = leaderboardTable.querySelector('tbody');
    const languageSearch = document.getElementById('language-search');
    const userSearch = document.getElementById('user-search');
    const userSearchCount = document.getElementById('user-search-count');
    let allLanguages = [];

    /**
     * Fetch the list of languages from the generated languages.json file.
     * Populate the dropdown menu with the list of languages.
     */
    fetch('./data/languages.json')
      .then(response => response.json())
      .then(languages => {
        // Alphanumeric order, case-insensitive: "python" sorts next to "Python",
        // and "C++11" after "C++2" rather than before it.
        languages = [...languages].sort((a, b) =>
          a.replace(/_/g, ' ').localeCompare(b.replace(/_/g, ' '), 'en', {
            sensitivity: 'base',
            numeric: true
          })
        );

        allLanguages = languages;
        renderLanguageOptions('');
      });

    /**
     * Rebuild the dropdown with only the languages matching the search query,
     * so a specific language can be reached by typing instead of scrolling.
     * The current selection is preserved whenever it still matches.
     *
     * @param {string} query - Substring to match against language names.
     */
    function renderLanguageOptions(query) {
      const needle = query.trim().toLowerCase();
      const previous = languageSelect.value;

      languageSelect.innerHTML = '<option value="">Global Leaderboard</option>';

      allLanguages
        .filter(language => language.replace(/_/g, ' ').toLowerCase().includes(needle))
        .forEach(language => {
          const option = document.createElement('option');
          option.value = language;
          option.textContent = language.replace(/_/g, ' ');
          languageSelect.appendChild(option);
        });

      languageSelect.value = previous;
      // The previous selection was filtered out: fall back to the best match.
      if (!languageSelect.value && previous) {
        languageSelect.selectedIndex = languageSelect.options.length > 1 ? 1 : 0;
        languageSelect.dispatchEvent(new Event('change'));
      }
    }

    languageSearch.addEventListener('input', () => renderLanguageOptions(languageSearch.value));

    /**
     * Fetch and display data for the selected language or global leaderboard.
     * Updates the leaderboard table with user rankings and either elo or time.
     *
     * @param {string} filePath - Path to the JSON file containing leaderboard data.
     * @param {boolean} isGlobal - Whether the leaderboard is global (uses elo).
     */
    function fetchLeaderboardData(filePath, isGlobal = false) {
      const scoreColumn = document.getElementById('score-column');
      scoreColumn.textContent = isGlobal ? 'Elo' : 'Time';

      fetch(filePath)
        .then(response => response.json())
        .then(data => {
          leaderboardBody.innerHTML = '';
          data.forEach((user, index) => {
            const row = document.createElement('tr');
            row.dataset.username = (user.username || '').toLowerCase();
            row.innerHTML = `
              <td>${index + 1}</td>
              <td><a href="https://wakatime.com/@${user.username}" target="_blank">${user.username}</a></td>
              <td>${isGlobal ? user.elo : user.time}</td>
            `;
            leaderboardBody.appendChild(row);
          });
          leaderboardTable.style.display = 'table';
          applyUserFilter();
        });
    }

    /**
     * Hide the leaderboard rows whose username does not match the search box.
     * Ranks stay untouched, so a matching user keeps its real position.
     */
    function applyUserFilter() {
      const needle = userSearch.value.trim().toLowerCase();
      let matches = 0;

      leaderboardBody.querySelectorAll('tr').forEach(row => {
        const visible = !needle || row.dataset.username.includes(needle);
        row.style.display = visible ? '' : 'none';
        if (visible) matches++;
      });

      userSearchCount.textContent = needle ? `${matches} match(es)` : '';
    }

    userSearch.addEventListener('input', applyUserFilter);

    /**
     * Fetch and display the global leaderboard data on page load.
     * This will show the top users globally using elo.
     */
    fetchLeaderboardData('./data/global_leaderboard.json', true);

    /**
     * Event listener for the language dropdown menu.
     * Fetches and displays the leaderboard for the selected language or the global leaderboard.
     */
    languageSelect.addEventListener('change', () => {
      const selectedLanguage = languageSelect.value;
      if (selectedLanguage) {
        fetchLeaderboardData(`./data/languages/${encodeURIComponent(selectedLanguage)}.json`);
      } else {
        fetchLeaderboardData('./data/global_leaderboard.json', true);
      }
    });

    /**
     * Load and plot the Elo distribution chart using Chart.js.
     * Fetches the global leaderboard data and processes it to create a line chart.
     */
    async function loadAndPlotElo() {
      const response = await fetch('./data/global_leaderboard.json');
      const data = await response.json();

      const elos = data.map(player => player.elo).filter(e => e > 0);

      // The raw Elo values are extremely skewed (a long tail up to ~18k), so a
      // linear histogram collapses into a spike. We bin on a log scale instead,
      // which turns the distribution into a readable (near log-normal) bell.
      const logs = elos.map(Math.log10);
      const minLog = Math.min(...logs);
      const maxLog = Math.max(...logs);
      const BINS = 32;
      const width = (maxLog - minLog) / BINS;

      const counts = new Array(BINS).fill(0);
      logs.forEach(l => {
        const i = Math.min(BINS - 1, Math.floor((l - minLog) / width));
        counts[i]++;
      });

      // Bin centers, back in Elo space, for readable axis labels.
      const centers = counts.map((_, i) => Math.round(10 ** (minLog + (i + 0.5) * width)));

      // Gaussian-smoothed density overlay (kernel over bin indices).
      const SIGMA = 1.2;
      const smooth = counts.map((_, i) => {
        let num = 0, den = 0;
        counts.forEach((c, j) => {
          const w = Math.exp(-((i - j) ** 2) / (2 * SIGMA * SIGMA));
          num += w * c;
          den += w;
        });
        return num / den;
      });

      const ctx = document.getElementById('eloChart').getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(75, 192, 192, 0.55)');
      gradient.addColorStop(1, 'rgba(75, 192, 192, 0.02)');

      new Chart(ctx, {
        data: {
          labels: centers,
          datasets: [
            {
              type: 'bar',
              label: 'Number of users',
              data: counts,
              backgroundColor: 'rgba(75, 192, 192, 0.35)',
              borderColor: 'rgba(75, 192, 192, 0.7)',
              borderWidth: 1,
              borderRadius: 3,
              categoryPercentage: 1.0,
              barPercentage: 0.96
            },
            {
              type: 'line',
              label: 'Smoothed density',
              data: smooth,
              borderColor: 'rgba(180, 230, 255, 1)',
              backgroundColor: gradient,
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              pointRadius: 0
            }
          ]
        },
        options: {
          plugins: {
            title: {
              display: true,
              text: 'Distribution of Elo scores (log-binned)'
            },
            tooltip: {
              callbacks: {
                title: items => `~${Number(items[0].label).toLocaleString()} Elo`
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: 'Score Elo (log scale)'
              },
              ticks: {
                maxRotation: 0,
                autoSkipPadding: 20,
                callback(value) {
                  return Number(this.getLabelForValue(value)).toLocaleString();
                }
              },
              grid: { display: false }
            },
            y: {
              title: {
                display: true,
                text: 'Number of users'
              },
              beginAtZero: true
            }
          }
        }
      });
    }

    loadAndPlotElo();
  </script>
</body>

</html>
